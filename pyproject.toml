[project]
name = "kampungcart"
version = "0.1.0"
description = "Make any small Singapore shop AI-ready from one photo of its menu."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.1",
    "google-cloud-firestore>=2.34.1",
    "google-genai>=2.26",
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
